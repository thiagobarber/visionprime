        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0d1117; }

        .cookie-text { font-size: 13.5px; line-height: 1.55; color: #475569; margin-bottom: 24px; }
        .actions { display: flex; gap: 12px; }
        .btn { flex: 1; padding: 12px 16px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; text-align: center; border: 1px solid transparent; transition: all 0.15s ease-in-out; }
        .btn-primary { background-color: #0f172a; color: #ffffff; }
        .btn-primary:hover { background-color: #1e293b; }
        .btn-secondary { background-color: transparent; color: #475569; border-color: #cbd5e1; }
        .btn-secondary:hover { background-color: #f8fafc; color: #0f172a; }
        .cookie-footer { margin-top: 16px; font-size: 11px; color: #94a3b8; text-align: center; }
    </style>
</head>
